<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ClassConnect - Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Hanken+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#fcf9f8",
                        "on-tertiary-fixed-variant": "#324f00",
                        "surface-variant": "#e5e2e1",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1b1b1b",
                        "action-blue": "#5C88D5",
                        "secondary": "#a93100",
                        "on-primary": "#ffffff",
                        "surface-container": "#f0eded",
                        "surface": "#fcf9f8",
                        "on-primary-container": "#7995e0",
                        "outline": "#747782",
                        "secondary-container": "#d44000",
                        "on-primary-fixed": "#001847",
                        "error-container": "#ffdad6",
                        "on-background": "#1b1b1b",
                        "secondary-fixed-dim": "#ffb59e",
                        "on-tertiary-container": "#74a52a",
                        "surface-tint": "#3e5ca2",
                        "tertiary-fixed": "#bdf370",
                        "primary-fixed-dim": "#b1c5ff",
                        "outline-variant": "#c4c6d2",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#444651",
                        "on-error": "#ffffff",
                        "primary-container": "#002b70",
                        "surface-container-highest": "#e5e2e1",
                        "inverse-on-surface": "#f3f0ef",
                        "secondary-fixed": "#ffdbd0",
                        "on-secondary-fixed-variant": "#842500",
                        "inverse-primary": "#b1c5ff",
                        "primary-fixed": "#dae2ff",
                        "inverse-surface": "#303030",
                        "success-green": "#76A72C",
                        "surface-alt": "#F5F9FA",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#3a0b00",
                        "surface-bright": "#fcf9f8",
                        "border-muted": "#DEDEDE",
                        "primary": "#001845",
                        "on-primary-fixed-variant": "#244488",
                        "tertiary": "#101e00",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#203500",
                        "on-secondary-container": "#fffbff",
                        "on-tertiary-fixed": "#111f00",
                        "surface-dim": "#dcd9d9",
                        "surface-container-high": "#eae7e7",
                        "surface-container-low": "#f6f3f2",
                        "tertiary-fixed-dim": "#a2d657",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "base": "4px",
                        "xl": "40px",
                        "xs": "4px",
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "lg": "24px",
                        "md": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "caption": ["Inter"],
                        "title-md": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "caption": ["11px", { "lineHeight": "14px", "fontWeight": "400" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .dot-pattern {
            background-image: radial-gradient(circle at 2px 2px, #e5e2e1 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-surface-alt text-on-surface font-body-md antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<!-- TopNavBar (Nav Shell Suppressed for Transactional Intent - Registration) -->
<!-- As per the rules: "Linear/Transactional: Login, Sign-up, Onboarding, Checkout... Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional." -->
<!-- Minimal Header for Transactional Pages -->
<header class="fixed top-0 left-0 w-full z-50 px-margin-mobile md:px-margin-desktop h-16 bg-surface border-b border-border-muted flex items-center justify-between">
<div class="font-headline-md text-headline-md font-bold text-primary">ClassConnect</div>
<a class="text-on-surface-variant hover:text-primary transition-colors text-body-md font-body-md" href="#">Sign In</a>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center pt-24 pb-16 px-margin-mobile md:px-margin-desktop relative z-10">
<!-- Decorative Background Elements -->
<div class="absolute top-20 left-10 w-64 h-64 dot-pattern opacity-50 -z-10 hidden md:block"></div>
<div class="absolute bottom-10 right-10 w-64 h-64 dot-pattern opacity-50 -z-10 hidden md:block"></div>
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-lg border border-border-muted p-6 md:p-10 relative">
<div class="text-center mb-8">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Registration</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Already have an account? <a class="text-primary font-bold hover:underline" href="#">Login</a></p>
</div>
<form class="space-y-6">
<!-- Row 1: Plan and Referral -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="plan">Choose Plan*</label>
<select class="w-full bg-surface-container-lowest border border-border-muted rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:border-action-blue focus:ring-2 focus:ring-action-blue/20 outline-none transition-all" id="plan">
<option value="">Select Plan</option>
<option value="basic">Basic Plan</option>
<option value="premium">Premium Plan</option>
</select>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="referral">Referral ID</label>
<input class="w-full bg-surface-container-lowest border border-border-muted rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-action-blue focus:ring-2 focus:ring-action-blue/20 outline-none transition-all" id="referral" placeholder="Enter referance code" type="text"/>
</div>
</div>
<!-- Row 2: Name and State -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="name">Your Name*</label>
<input class="w-full bg-surface-container-lowest border border-border-muted rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-action-blue focus:ring-2 focus:ring-action-blue/20 outline-none transition-all" id="name" placeholder="Enter your name" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="state">State*</label>
<select class="w-full bg-surface-container-lowest border border-border-muted rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:border-action-blue focus:ring-2 focus:ring-action-blue/20 outline-none transition-all" id="state">
<option value="">Select State</option>
<option value="CA">California</option>
<option value="NY">New York</option>
<option value="TX">Texas</option>
</select>
</div>
</div>
<!-- Row 3: Mobile and Email -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="mobile">Mobile*</label>
<input class="w-full bg-surface-container-lowest border border-border-muted rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-action-blue focus:ring-2 focus:ring-action-blue/20 outline-none transition-all" id="mobile" placeholder="Enter your mobileNumber" type="tel"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="email">Email ID*</label>
<input class="w-full bg-surface-container-lowest border border-border-muted rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-action-blue focus:ring-2 focus:ring-action-blue/20 outline-none transition-all" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Row 4: Password -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="password">Password*</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-border-muted rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-action-blue focus:ring-2 focus:ring-action-blue/20 outline-none transition-all pr-10" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 px-3 flex items-center text-outline-variant hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Agreement -->
<div class="flex items-center gap-2 mt-4">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-border-muted rounded focus:ring-action-blue focus:ring-2" id="agreement" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant" for="agreement">
                        I agree the User Agreement and <a class="text-primary hover:underline" href="#">Terms &amp; Conditions.</a>
</label>
</div>
<!-- Price & Submit -->
<div class="mt-8 border-t border-border-muted pt-6">
<div class="mb-4">
<span class="block font-body-md text-body-md text-on-surface-variant">Price :</span>
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-outline line-through">Rs.0</span>
<span class="font-headline-lg text-headline-lg font-bold text-secondary-container">Rs.0</span>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary rounded-DEFAULT py-3 font-label-md text-label-md uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98]" type="submit">
                        Register
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- FAB for Chat/Support (Contextual to the Image) -->
<button class="fixed bottom-8 right-8 w-14 h-14 bg-primary-container text-on-primary rounded-full shadow-lg flex items-center justify-center hover:bg-primary transition-colors active:scale-95 z-50">
<span class="material-symbols-outlined" data-icon="chat" style="font-variation-settings: 'FILL' 1;">chat</span>
</button>
</body></html>
